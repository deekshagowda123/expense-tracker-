<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Finance — Transactions</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&family=Poppins:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body data-initial-route="transactions">
  <!-- Reuse same layout as index, but initial route set -->
  <!-- Sidebar -->
  <div class="app" id="app">
    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <div class="logo">FD</div>
        <div class="title">Finance</div>
      </div>
      <nav>
        <a href="dashboard.html">Dashboard</a>
        <a href="transactions.html" class="active">Transactions</a>
        <a href="budgets.html">Budgets</a>
        <a href="goals.html">Goals</a>
        <a href="reports.html">Reports</a>
        <a href="settings.html">Settings</a>
      </nav>
      <div class="theme-toggle">
        <label class="switch"><input id="themeSwitch" type="checkbox"><span></span></label>
        <small>Dark</small>
      </div>
    </aside>

    <main class="main">
        <header class="topbar">
        <div class="search"><input id="globalSearch" placeholder="Search transactions, categories, notes..."></div>
        <div class="top-actions"><button id="addTxBtn" class="btn accent">+ Add</button><div class="user"><div class="username">Hi, Dimpl</div><div class="avatar">DG</div></div></div>
      </header>
      <section class="content" id="content">
        <!-- include the same content blocks as index.html; script will show transactions -->
        <!-- Dashboard, Transactions, Budgets, Goals, Reports, Settings sections copied from index.html -->
        <!-- Dashboard -->
        <div id="dashboard" class="page">
          <!-- (dashboard content omitted for brevity; script controls visibility) -->
        </div>
        <!-- Transactions -->
        <div id="transactions" class="page hidden">
          <div class="card glass actions-row">
            <div><button id="newTx" class="btn">New Transaction</button></div>
            <div><select id="filterType"><option value="all">All</option><option value="income">Income</option><option value="expense">Expense</option></select>
              <select id="filterCategory"><option value="all">All categories</option></select>
              <input id="txSearch" placeholder="Search transactions"></div>
          </div>
          <div class="card glass">
            <table id="txTable" class="transactions full">
              <thead><tr><th>Title</th><th>Category</th><th>Type</th><th>Date</th><th>Amount</th><th>Actions</th></tr></thead>
              <tbody></tbody>
            </table>
          </div>
        </div>
        <!-- Other sections are loaded by script if needed -->
      </section>
    </main>
  </div>
  <div id="modalRoot"></div>
  <div id="toastRoot" class="toasts"></div>
  <script src="script.js"></script>
</body>
</html>
